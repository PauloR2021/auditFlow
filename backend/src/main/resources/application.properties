# ==========================================
# APLICAÇÃO
# ==========================================
spring.application.name=backend
server.port=${APP_PORT:8080}


# ==========================================
# LEITURA DO .ENV
# Caminho relativo à pasta de execução da API
spring.config.import=file:./.env[.properties]

# ==========================================
# POSTGRESQL
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA / HIBERNATE
# Cria e atualiza tabelas com base nas entidades
# Configuração para desenvolvimento local
# ==========================================
spring.jpa.hibernate.ddl-auto=update
# Evita manter a sessão do banco aberta durante a resposta HTTP
spring.jpa.open-in-view=false
# Exibe e formata o SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# FLYWAY
# Desativado enquanto Hibernate controla as tabelas
# ==========================================
spring.flyway.enabled=false

# ==========================================
# INICIALIZAÇÃO POR SCRIPTS SQL
# Desativada: Hibernate cuida da estrutura nesta etapa
# ==========================================
spring.sql.init.mode=never